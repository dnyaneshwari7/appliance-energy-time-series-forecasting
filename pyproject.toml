[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appliance-energy-time-series-forecasting"
version = "0.1.0"
description = "Time-series case study for appliance energy demand forecasting."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

